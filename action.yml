name: 'action-github-app-token'
description: 'Gets a GitHub auth token for a GitHub App installation'
author: 'sentry.io'
inputs:
  app_id:
    required: true
    description: 'GitHub App ID'
  private_key:
    required: true
    description: 'Private key for the GitHub App'
  scope:
    required: false
    description: 'Scope of installation account'
    default: ''
  repositories:
    required: false
    description: 'Comma- or newline-separated repository names within the selected installation; omitted means all installation repositories'
    default: ''
  contents-read-only:
    required: false
    description: 'Request only repository Contents read permission (plus implicit Metadata read)'
    default: 'false'
outputs:
  token:
    description: 'Github Token for App installation'
runs:
  using: 'node24'
  main: 'dist/index.js'
